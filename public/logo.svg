<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <!-- House icon -->
  <g transform="translate(10, 5)">
    <!-- House shape -->
    <path d="M20,0 L0,15 L0,40 L40,40 L40,15 Z" fill="url(#logoGradient)" />
    
    <!-- Door -->
    <rect x="15" y="25" width="10" height="15" fill="white" />
    
    <!-- Window -->
    <rect x="7" y="20" width="8" height="8" fill="white" />
    <rect x="25" y="20" width="8" height="8" fill="white" />
  </g>
  
  <!-- Text -->
  <text x="60" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#111827">AI Room</text>
  <text x="140" y="30" font-family="Arial" font-size="20" font-weight="bold" fill="#8b5cf6">Design</text>
</svg>